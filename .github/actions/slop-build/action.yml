name: Build Slopworks Godot
description: Build one Godot target through build.sh with a SCons cache kept per branch, then upload the binaries.

inputs:
  name:
    description: Artifact and cache name.
    required: true
  platform:
    description: SCons platform (linuxbsd or windows).
    required: true
  target:
    description: SCons target (editor, template_debug or template_release).
    required: true
  scons-flags:
    description: Extra SCons flags.
    default: ""

runs:
  using: composite
  steps:
    # Runs in the Fedora container the workflow gives Windows jobs, matching the official build image.
    # Ubuntu's MinGW headers are too old for Godot 4.7.
    - name: Install MinGW, Python and SCons
      if: inputs.platform == 'windows'
      shell: bash
      run: |
        dnf -y install --setopt=install_weak_deps=False \
          bash binutils bzip2 curl file findutils gettext git make patch pkgconfig python3-pip unzip which xz tar zstd \
          mingw64-gcc mingw64-gcc-c++ mingw64-winpthreads-static
        python3 -m pip install scons==4.10.1

    - name: Install Linux build dependencies
      if: inputs.platform == 'linuxbsd'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwayland-bin

    # Godot's own toolchain, as used by the official builds. Binaries need glibc 2.34 whatever the runner has.
    - name: Install Godot Linux SDK
      if: inputs.platform == 'linuxbsd'
      shell: bash
      run: |
        sdk_name=x86_64-godot-linux-gnu_sdk-buildroot
        cd "$RUNNER_TEMP"
        curl -fsSL -o sdk.tar.bz2 "https://github.com/godotengine/buildroot/releases/download/${GODOT_SDK_VERSION}/${sdk_name}.tar.bz2"
        tar xf sdk.tar.bz2
        rm sdk.tar.bz2
        cd "$sdk_name"
        ./relocate-sdk.sh
        echo "$PWD/bin" >> "$GITHUB_PATH"

    - name: Setup Python and SCons
      if: inputs.platform == 'linuxbsd'
      uses: ./.github/actions/godot-deps

    - name: Download AccessKit
      id: accesskit
      shell: bash
      run: |
        if python3 ./misc/scripts/install_accesskit.py; then
          echo "enabled=yes" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::AccessKit download failed. Building without screen reader support."
          echo "enabled=no" >> "$GITHUB_OUTPUT"
        fi

    # The Windows platform enables Direct3D 12 by default, and it needs Mesa NIR, the Agility SDK and PIX.
    - name: Download Direct3D 12 dependencies
      if: inputs.platform == 'windows'
      shell: bash
      run: python3 ./misc/scripts/install_d3d12_sdk_windows.py

    # Keyed on the branch so every release run on it reuses the previous run's objects.
    - name: Restore SCons cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.scons_cache/
        key: slop-${{ inputs.name }}|${{ github.ref_name }}|${{ github.sha }}
        restore-keys: slop-${{ inputs.name }}|${{ github.ref_name }}|

    - name: Build
      shell: bash
      run: |
        echo "CACHE_TIMESTAMP=$(date +%s)" >> "$GITHUB_ENV"
        PLATFORM=${{ inputs.platform }} ./build.sh \
          target=${{ inputs.target }} \
          ${{ env.SCONS_FLAGS }} ${{ inputs.scons-flags }} \
          accesskit=${{ steps.accesskit.outputs.enabled }} \
          "cache_path=${{ github.workspace }}/.scons_cache/" \
          redirect_build_objects=no \
          -j"$(nproc)"
        ls -l bin/

    - name: Purge stale cache entries
      if: always()
      shell: bash
      run: misc/scripts/purge_cache.py "$CACHE_TIMESTAMP" "${{ github.workspace }}/.scons_cache/"

    - name: Save SCons cache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/.scons_cache/
        key: slop-${{ inputs.name }}|${{ github.ref_name }}|${{ github.sha }}

    - name: Upload binaries
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: bin/godot.*
        if-no-files-found: error
        retention-days: 7
